name: DataSchema Code Convention

on:
  push:
    branches: [ "main", "laboratory-work-4" ]

jobs:
  JSONLinter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code in Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install JSON Linter
        run: |
          npm i -g @prantlf/jsonlint

      - name: Run JSON Linter
        run: |
          jsonlint $GITHUB_WORKSPACE/DataSchema.json
