name: Print Software Versions

on:
  push:
    branches: [ "main", "laboratory-work-4" ]

jobs:
  software_processing_level:
    name: Check Python & OpenCV Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Print Python Version
        run: python --version

      - name: Install OpenCV & Print Version
        run: |
          pip install opencv-python
          python -c "import cv2; print('OpenCV version:', cv2.__version__)"

  dbms_level:
    name: Install MongoDB and Print Version
    runs-on: ubuntu-latest
    needs: [software_processing_level]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install MongoDB
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg curl
          curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc | sudo gpg -o /usr/share/keyrings/mongodb-server-7.0.gpg --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org

      - name: Print MongoDB Version
        run: mongod --version
