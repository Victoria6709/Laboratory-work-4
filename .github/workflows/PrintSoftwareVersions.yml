name: Print Software Versions

on:
  push:
    branches: [ "main", "laboratory-work-4" ]

jobs:
  software_processing_level:
    name: Check Python & OpenCV Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Print Python Version
        run: python --version

      - name: Install OpenCV & Print Version
        run: |
          pip install opencv-python
          python -c "import cv2; print('OpenCV version:', cv2.__version__)"

  dbms_level:
    name: Check DBMS Version (MongoDB)
    runs-on: ubuntu-latest
    needs: [software_processing_level]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Start MongoDB and check version
        run: |
          sudo systemctl start mongodb || sudo systemctl start mongod || true
          mongod --version
