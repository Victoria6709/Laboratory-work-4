name: Program Code Convention

on:
  push:
    branches: [ "main", "laboratory-work-4" ]

jobs:
  ProgramCodeLinter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code in Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Flake8 Linter
        run: |
          pip install flake8

      - name: Run Python Linter (Flake8)
        run: |
          flake8 ProgramCode.py
